version: '3.3'

services:
  nginx:
    image: nginx:latest #WebサーバのDockerイメージはNginxの最新版
    ports:
      - 9998:80 #ポート番号は80を使います。
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./src:/var/www/html
    depends_on:
      - php
    restart: always

  php:
    build: ./php
    volumes:
      - ./src:/var/www/html
    depends_on:
      - mysql
    restart: always

  mysql:
    image: mysql:8.0
    volumes:
      - db_data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: 'password'
    ports:
      - "3307:3306"
    restart: always

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    environment:
      PMA_HOST: mysql
    ports:
      - 3031:80
    depends_on:
      - mysql
    restart: always

  mailhog:
    image: mailhog/mailhog
    ports:
      - 8026:8025  # WebUI
    restart: always

volumes:
    db_data: